name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: Static structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check package references, function names, ignore rules, paths
        run: python tools/check_structure.py

  manuscript:
    name: Manuscript builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder dependencies
        run: pip install -r manuscript/requirements.txt
      - name: Byte-compile the builders
        run: python -m compileall -q manuscript
      # The builders read results/tables/*.csv, which only exist after a MATLAB
      # run. When those tables are present in the checkout the documents are
      # rebuilt and any drift between the text and the analysis fails the job;
      # when they are absent — as in the public code-only repository — the step
      # is skipped rather than faked.
      - name: Rebuild manuscript if result tables are present
        run: |
          if [ -d results/tables ] && [ -n "$(ls -A results/tables/*.csv 2>/dev/null)" ]; then
            python manuscript/build_v5_docx.py
            python manuscript/build_v5_supplement_docx.py
          else
            echo "no result tables in this checkout; skipping document build"
          fi

  matlab:
    name: MATLAB tests
    runs-on: ubuntu-latest
    # MATLAB needs a licence token in repository secrets. Without one this job
    # is skipped rather than reported as passing, because a green check that
    # ran nothing is worse than a visibly absent one.
    if: ${{ github.repository_owner != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for a licence token
        id: licence
        run: |
          if [ -n "${{ secrets.MLM_LICENSE_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MLM_LICENSE_TOKEN not set; MATLAB tests not run"
          fi
      - uses: matlab-actions/setup-matlab@v2
        if: steps.licence.outputs.available == 'true'
        with:
          release: R2024b
          products: |
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox
            Image_Processing_Toolbox
      - uses: matlab-actions/run-command@v2
        if: steps.licence.outputs.available == 'true'
        env:
          MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
        with:
          command: run_tests
